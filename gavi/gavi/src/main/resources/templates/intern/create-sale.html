<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" th:href="@{https://fonts.googleapis.com}">
  <link rel="preconnect" th:href="@{https://fonts.gstatic.com}" crossorigin>
  <link rel="stylesheet"
        th:href="@{https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap}">
  <link rel="stylesheet"
        th:href="@{https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0}"/>
  <link rel="stylesheet" th:href="@{/css/fragments-style.css}">
  <link rel="stylesheet" th:href="@{/css/create-sale.css}">
  <link rel="shortcut icon" th:href="@{/imgs/logo_gavi.png}" type="image/x-icon">
  <title>Gavi Pro</title>
</head>

<body>
  <!--Header-->
  <div th:replace="fragments :: header"></div>
  <!--Menu-->
  <div th:replace="fragments :: menu-nav"></div>

  <main>
    <section class="btns-main">
      <a th:href="@{/sales}" class="btn-actions">
        <span class="material-symbols-rounded">
          receipt_long
        </span>Show sales
      </a>
      <a th:href="@{/sales/create-sale}" class="btn-actions">
        <span class="material-symbols-rounded">
          currency_exchange
        </span>Create a sale
      </a>
    </section>

    <hr>

    <section class="sale-form">
      <h4>New sale</h4>
      <form class="form-search">
        <div class="search-input">
          <label for="product-code">Product code</label>
          <input type="text" id="product-code" name="product-code" required>
        </div>
        <div class="search-input">
          <label for="product-name">Product name</label>
          <input type="text" id="product-name" name="product-name" required>
        </div>
        <div class="search-input">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" step="0.01" required>
        </div>

        <input type="button" value="Search">
      </form>
    </section>

    <section class="sale-container">
      <article class="product-list">
        <table class="product-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Product name</th>
              <th>Unit</th>
              <th class="w-q">Quantity</th>
              <th>Unit price</th>
              <th>Subtotal</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>123456</td>
              <td>PAPA CAPIRA SIN LAVAR</td>
              <td>KG</td>
              <td class="w-q">
                <input type="number" name="quantity" id="td-quantity" step="0.01" required>
              </td>
              <td>1250.0</td>
              <td>350.0</td>
              <td>
                <a class="btn-td remove-btn" href="#">
                  <span class="material-symbols-rounded">remove</span>
                </a>
              </td>
            </tr>

          </tbody>
        </table>
      </article>

      <article class="info">
        <div class="totals">
          <div class="totals-group">
            <h3>Subtotal</h3>
            <h3>15000</h3>
          </div>
          <div class="totals-group">
            <h3>Total taxes</h3>
            <h3>15000</h3>
          </div>
          <div class="totals-group">
            <h3>Total</h3>
            <h3>15000</h3>
          </div>
        </div>

        <div class="payment">
          <div class="totals-group">
            <label>Payment method:</label>
            <select name="payment-method" id="payment-method">
              <option value="" disabled selected>Select a payment method></option>
              <option th:each="paymentMethod : ${paymentMethods}"
                      th:value="${paymentMethod.name()}"
                      th:text="${paymentMethod.name()}">
              </option>
            </select>
          </div>
        </div>

        <div class="payment-btn">
          <button type="submit" class="btn-sale" id="send">Send</button>
          <button type="reset" class="btn-sale" id="cancel">Cancel</button>
        </div>
      </article>
    </section>

  </main>

  <script th:src="@{/scripts/products.js}"></script>
  <script th:src="@{/scripts/fragment-script.js}"></script>
</body>

</html>
